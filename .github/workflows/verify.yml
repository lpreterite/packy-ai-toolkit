name: verify

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 结构/引用完整性校验
        run: node scripts/verify.mjs
      - name: image-gen CLI 单测
        run: cd tools/image-gen && npm test
